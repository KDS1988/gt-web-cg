name: fhr-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir s && cd s
          B=https://junior.fhr.ru/tournaments/kubokrossii-25008909
          get(){ curl -sS -m 40 -A "Mozilla/5.0" -o "$1" "$2" || echo "fail $2"; }
          AJ='https://junior.fhr.ru/fhr-ajax/SXRwcm9maXRcQXBwXEFqYXhcQWpheENvbXBvbmVudA==/cmVuZGVyQ29tcG9uZW50/?template=.default'
          P_ALL='YTo0OntzOjEzOiJUT1VSTkFNRU5UX0lEIjtzOjg6IjI1MDA4OTA5IjtzOjg6IkdST1VQX0lEIjtzOjM6ImFsbCI7czo3OiJZRUFSX0lEIjtzOjg6IjI1MDA4OTUwIjtzOjc6ImlzX2FqYXgiO2I6MTt9'
          P_BII='YTo0OntzOjEzOiJUT1VSTkFNRU5UX0lEIjtzOjg6IjI1MDA4OTA5IjtzOjg6IkdST1VQX0lEIjtzOjg6IjI2Mjg4NjY3IjtzOjc6IllFQVJfSUQiO3M6ODoiMjUwMDg5NTAiO3M6NzoiaXNfYWpheCI7YjoxO30%3D'
          get team_dinamo.html $B/dinamo_3229852/
          get team_lok.html "$B/$(curl -sS -A Mozilla/5.0 $B/ | grep -o 'href="/tournaments/kubokrossii-25008909/lokomotiv[^"]*"' | head -1 | sed 's#href="/tournaments/kubokrossii-25008909/##;s#"##')"
          get aj_cal_BII.html "$AJ&component=itprofit%3Acompetitions-calendar&params=$P_BII"
          get aj_table_BII.html "$AJ&component=itprofit%3Atournament-page&params=$P_BII"
          get aj_teams_BII.html "$AJ&component=itprofit%3Acompetitions-teams&params=$P_BII"
          get aj_bomb.html "$AJ&component=itprofit%3Acompetitions-stats&params=$P_ALL&stats=BOMBARDIRS"
          curl -sS -m 40 -A "Mozilla/5.0" -H "X-Requested-With: XMLHttpRequest" -o aj_bomb_xhr.html "$AJ&component=itprofit%3Acompetitions-stats&params=$P_ALL&stats=BOMBARDIRS"
          wc -c *
          ls -la
          cd .. && git init -q r && cd r && git checkout -q -b fhr-samples2 && cp ../s/* . && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm samples && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fhr-samples2 && echo "::notice::pushed $(ls | wc -l) files team=$T"
