name: fhr-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          R=$(curl -sS -m 30 -o cal.html -w "status %{http_code} size %{size_download} time %{time_total}" -A "Mozilla/5.0" https://junior.fhr.ru/tournaments/kubokrossii-25008909/calendar/ 2>&1 || true)
          N=$(grep -o '/games/[0-9]*' cal.html 2>/dev/null | sort -u | wc -l)
          echo "::notice::$R games=$N"
